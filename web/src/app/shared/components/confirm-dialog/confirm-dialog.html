<div class="backdrop" (click)="cancelled.emit()">
  <div class="dialog" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <h2>{{ title() }}</h2>
    <p>{{ message() }}</p>
    <div class="actions">
      <button class="btn-secondary" (click)="cancelled.emit()">Cancel</button>
      <button class="btn-danger" (click)="confirmed.emit()">{{ confirmText() }}</button>
    </div>
  </div>
</div>
