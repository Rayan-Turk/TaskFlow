@if (totalPages() > 1) {
  <div class="pager">
    <button (click)="pageChange.emit(page() - 1)" [disabled]="page() <= 1">Previous</button>

    @for (p of pages(); track $index) {
      @if (p === '...') {
        <span class="dots">…</span>
      } @else {
        <button
          class="page-btn"
          [class.active]="p === page()"
          (click)="p !== page() && pageChange.emit(p)"
        >
          {{ p }}
        </button>
      }
    }

    <button (click)="pageChange.emit(page() + 1)" [disabled]="page() >= totalPages()">Next</button>
  </div>
}
